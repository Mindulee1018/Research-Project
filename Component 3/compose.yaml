services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sl-risk-backend
    ports:
      - "5000:5000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: 5000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MODEL_DIR: /opt/artifacts/model
      REWRITE_DIR: /opt/artifacts/rewrite_index
      GCP_CREDENTIALS_PATH: /run/secrets/credentials.json
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GCP_LOCATION: ${GCP_LOCATION:-us-central1}
      GENAI_MODEL: ${GENAI_MODEL:-gemini-2.5-flash-lite}
      GENAI_TIMEOUT_SEC: ${GENAI_TIMEOUT_SEC:-15}
      DECISION_LOG_PATH: /app/backend/runtime/moderator_decisions.jsonl
      LLM_SUGGESTIONS_ENABLED: ${LLM_SUGGESTIONS_ENABLED:-true}
      STRICT_SHAP_REQUIRED: ${STRICT_SHAP_REQUIRED:-true}
      STRICT_ATTENTION_REQUIRED: ${STRICT_ATTENTION_REQUIRED:-true}
      EXPLAIN_LIME_NUM_SAMPLES: ${EXPLAIN_LIME_NUM_SAMPLES:-1200}
      EXPLAIN_LIME_NUM_SAMPLES_FAST: ${EXPLAIN_LIME_NUM_SAMPLES_FAST:-200}
      SHAP_MAX_EVALS: ${SHAP_MAX_EVALS:-200}
      SHAP_MAX_EVALS_FAST: ${SHAP_MAX_EVALS_FAST:-40}
    volumes:
      - ${MODEL_DIR_HOST}:/opt/artifacts/model:ro
      - ${REWRITE_DIR_HOST}:/opt/artifacts/rewrite_index:ro
      - ${GCP_CREDENTIALS_HOST}:/run/secrets/credentials.json:ro
      - backend_runtime:/app/backend/runtime
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sl-risk-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:5000}
      NEXT_PUBLIC_MODERATOR_ID: ${NEXT_PUBLIC_MODERATOR_ID:-docker_moderator}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_runtime:
